name: Publish from Notion

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate without writing files or updating Notion)'
        required: false
        default: false
        type: boolean
      page_id:
        description: 'Optional Notion Page ID (sync only this specific page)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: notion-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Sync & Publish Notion Posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install notion-client requests Pillow

      - name: Run sync script unit tests
        run: |
          python3 .github/scripts/test_notion_sync.py

      - name: Run Notion sync script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          ARGS=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Running in dry-run mode..."
            ARGS+=(--dry-run)
          fi
          if [ -n "${{ inputs.page_id }}" ]; then
            echo "Targeting specific Notion page ID: ${{ inputs.page_id }}"
            ARGS+=(--page-id "${{ inputs.page_id }}")
          fi
          python3 .github/scripts/notion_sync.py "${ARGS[@]}"

      - name: Validate generated post assets & links
        run: |
          python3 - << 'EOF'
          import glob, os, re, sys

          errors = []
          post_files = sorted(glob.glob("_posts/*.md"))
          for path in post_files:
              with open(path, "r", encoding="utf-8") as fh:
                  content = fh.read()

              if "/public/public/" in content:
                  errors.append(f"{path}: contains duplicated '/public/public/' path")

              # Validate front matter image exists on disk
              for m in re.finditer(r"^image:\s*(.+)$", content, re.MULTILINE):
                  val = m.group(1).strip().strip("'\"")
                  if val.startswith("/public/"):
                      local_target = val.lstrip("/")
                      if not os.path.isfile(local_target):
                          errors.append(f"{path}: front matter image '{val}' does not exist on disk at '{local_target}'")

              # Validate inline markdown images exist on disk
              for m in re.finditer(r"!\[.*?\]\((/public/[^)\s]+)\)", content):
                  val = m.group(1).strip()
                  local_target = val.lstrip("/")
                  if not os.path.isfile(local_target):
                      errors.append(f"{path}: markdown image '{val}' does not exist on disk at '{local_target}'")

          if errors:
              print("Post image link validation failed:")
              for e in errors:
                  print("  -", e)
              sys.exit(1)
          print(f"Validated all post image links across {len(post_files)} posts.")
          EOF

      - name: Commit and push new posts & images
        run: |
          if [ -n "$(git status --porcelain _posts/ public/images/)" ]; then
            echo "New posts or images detected. Committing changes..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _posts/ public/images/
            git commit -m "Publish: New post from Notion [skip ci]"
            git push origin main
            echo "Successfully published and pushed changes to main."
          else
            echo "No new or modified posts or images to commit. Working tree clean."
          fi
