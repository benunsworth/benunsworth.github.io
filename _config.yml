# Setup
title:               Ben Unsworth
tagline:             'Things I email myself'
description:         'A personal blog by Ben Unsworth'
url:                 https://benunsworth.co.uk
baseurl:             ''
paginate:            5
permalink:           pretty

# About/contact
author:
  name:              Ben Unsworth
  url:               https://benunsworth.co.uk
  email:             ben.unsworth1+blog@gmail.com

social:
  name:              Ben Unsworth
  links:
    - https://www.linkedin.com/in/unsworthben/
    - https://bsky.app/profile/benunsworth.co.uk

# Gems
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Custom vars
version:             1.1.0
google_analytics_id: G-0J73RYL13Y

# Default front matter for posts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      type: "note"

# Exclude repository metadata from published _site
exclude:
  - AGENTS.md
  - README.md
  - LICENSE.md
  - Gemfile
  - Gemfile.lock

