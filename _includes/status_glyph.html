{%- assign glyph_status = include.status | downcase | strip -%}
{%- case glyph_status -%}
  {%- when "rough" -%}
    <svg class="status-glyph-svg" viewBox="0 0 10 10" width="10" height="10" aria-hidden="true" focusable="false"><circle cx="5" cy="5" r="4.1" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2.2 1.8" stroke-linecap="round" /></svg>
  {%- when "in-progress" -%}
    <svg class="status-glyph-svg" viewBox="0 0 10 10" width="10" height="10" aria-hidden="true" focusable="false"><circle cx="5" cy="5" r="4.1" fill="none" stroke="currentColor" stroke-width="1.3" /><path d="M 5,0.9 A 4.1,4.1 0 0,0 5,9.1 Z" fill="currentColor" /></svg>
  {%- when "settled" -%}
    <svg class="status-glyph-svg" viewBox="0 0 10 10" width="10" height="10" aria-hidden="true" focusable="false"><circle cx="5" cy="5" r="4.4" fill="currentColor" /></svg>
{%- endcase -%}
