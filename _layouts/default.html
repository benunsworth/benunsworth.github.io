<!DOCTYPE html>
<html lang="en-GB">

  {% include head.html %}

  <body>

    <div class="wrap">
      <header class="masthead">
        <div class="container{% if page.wide_layout or page.url == '/' or page.title == 'Home' %} container--wide{% endif %} masthead-inner">
          <div class="masthead-brand">
            <div class="masthead-title">
              <a href="{{ '/' | relative_url }}" title="Home">{{ site.title }}</a>
              <small>{{ site.tagline }}</small>
            </div>
          </div>

          <nav class="masthead-nav" aria-label="Primary navigation">
            <a class="masthead-nav-link{% if page.url == '/' or page.title == 'Home' %} active{% endif %}" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Garden</a>
            <a class="masthead-nav-link{% if page.url == '/archive/' %} active{% endif %}" href="{{ '/archive/' | relative_url }}"{% if page.url == '/archive/' %} aria-current="page"{% endif %}>Archive</a>
            <a class="masthead-nav-link{% if page.url == '/tags/' %} active{% endif %}" href="{{ '/tags/' | relative_url }}"{% if page.url == '/tags/' %} aria-current="page"{% endif %}>Topics</a>
            <a class="masthead-nav-link{% if page.url == '/about/' %} active{% endif %}" href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
            <a class="masthead-nav-link" href="{{ '/atom.xml' | relative_url }}">RSS</a>
          </nav>
        </div>
      </header>

      <main id="main-content" class="container{% if page.wide_layout or page.url == '/' or page.title == 'Home' %} container--wide{% endif %} content">
        {{ content }}
      </main>
    </div>

    <script src='{{ site.baseurl }}/public/js/script.js'></script>
  </body>
</html>
